; Lab 1 - ESP32 DC Motor Controller with OLED Telemetry
; PlatformIO build config for local simulation with Wokwi for VS Code.
;
; Build:  PlatformIO sidebar -> esp32dev -> General -> Build   (or: pio run)
; Sim:    F1 -> "Wokwi: Start Simulator"

[platformio]
src_dir = sketch

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
	adafruit/Adafruit GFX Library@^1.11
	adafruit/Adafruit SSD1306@^2.5
	adafruit/DHT sensor library@^1.4
	adafruit/Adafruit Unified Sensor@^1.1
