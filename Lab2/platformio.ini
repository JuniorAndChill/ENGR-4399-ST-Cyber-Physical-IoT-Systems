; PlatformIO build config - Lab 2, ESP32 Three-Voice Chiptune Jukebox
;
;   pio run                 build
;   pio run -t upload       build and flash
;   pio device monitor      Serial at 115200
;
; src_dir points at sketch/ so PlatformIO compiles sketch.ino and the
; headers beside it without the files having to move.

[platformio]
src_dir = sketch

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; arduino-esp32 3.x is required: the sketch uses ledcAttach() and the
; pin-based ledcWrite(), neither of which exists on 2.x.
platform_packages =
    platformio/framework-arduinoespressif32 @ ^3.20017.0

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit BusIO @ ^1.15.0

build_flags =
    -Wall
